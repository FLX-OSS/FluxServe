[dependency-groups]
# Install with `pip install --no-deps --group sm100-nodeps`, as the image does. flashinfer-dllm declares
# newer cutlass-dsl, cuda-tile and cudnn-frontend than this stack runs, and the image's NCCL and nvJitLink
# conflict with torch's pins. The nvcc, crt, tileiras and nvvm wheels came from FlashInfer's cuda-tile
# build hook in the image.
sm100-nodeps = [
    "flashinfer-python @ git+https://github.com/FLX-OSS/flashinfer-dllm.git@a7d243e0b25697b021cc9366f1326d7b5013287b",
    "nvidia-nccl-cu13==2.31.2",
    "nvidia-nvjitlink==13.3.33",
    "nvidia-cuda-nvcc==13.3.73",
    "nvidia-cuda-crt==13.3.73",
    "nvidia-cuda-tileiras==13.3.36",
    "nvidia-nvvm==13.3.73",
]
