# FluxServe pip install profiles: one extra per GPU platform, each pinned to a FluxServe image, plus a shared `dev`.
#
#   Extra  GPU                         Image                                                   TORCH_CUDA_ARCH_LIST
#   sm120  RTX PRO 6000 Blackwell      flux-sm120 (docker/Dockerfile.flux-sm120)               12.0
#   sm100  B200                        flux-cu130-gemma (sglang v0.5.12.post1 cu130 base)      10.0a
#   sm90   H100/H200                   flux-cu130-fa4 (docker/Dockerfile.flux-cu130-fa4)       9.0
#
#   BUILD_NVEP=0 FLASHINFER_BUILD_NO_PIP=1 pip install -e ".[sm120,dev]" \
#       --extra-index-url https://download.pytorch.org/whl/cu130
#   pip install --no-deps --group sm100-nodeps    # B200 only
# Then install flux-kernel and flux-scheduler; see docs/guides/getting_started.md.
# Base dependencies stay empty so `pip install -e .` inside the containers is unchanged.

[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxserve"
# setup.py sets the version (python/fluxserve/__init__.py) and python_requires, which setuptools lets
# override requires-python. The containers run Python 3.12, and the numpy 2.5 / scipy 1.18 pins need >=3.12.
dynamic = ["version", "requires-python"]
description = "A High-Performance Inference Serving Library for Diffusion Language Model"
license = "MIT"
dependencies = []

[project.optional-dependencies]
