[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxserve"
dynamic = ["version"]
description = "A high-performance inference serving library for diffusion language models"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "aiohttp==3.13.0",
    "apache-tvm-ffi==0.1.12",
    "fastapi==0.118.2",
    "flashinfer-python==0.6.13",
    "flux-kernel",
    "flux-scheduler",
    "huggingface-hub==0.35.3",
    "nanobind>=1.7.0",
    "ninja==1.13.0",
    "numpy==2.3.3",
    "nvidia-cutlass-dsl==4.6.0",
    "nvidia-ml-py==13.580.82",
    "packaging==25.0",
    "pyzmq==27.1.0",
    "safetensors==0.6.2",
    "scikit-build-core==0.11.6",
    "setproctitle==1.3.7",
    "sgl-kernel==0.3.15",
    "tokenizers==0.22.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.0",
    "triton==3.4.0",
    "uvicorn==0.37.0",
]

[project.scripts]
fluxserve = "fluxserve.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]
exclude = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "fluxserve.__version__" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
flashinfer-python = { git = "https://github.com/kennethzhao24/flashinfer-dllm.git", rev = "631231b2d8a6b7a1d59dfcc9be13b81df30a3416" }
flux-kernel = { path = "flux-kernel/python", editable = true }
flux-scheduler = { path = "flux-scheduler", editable = true }

[tool.uv.extra-build-dependencies]
flux-kernel = [
    "setuptools>=83.0.0",
    "torch==2.8.0",
    "apache-tvm-ffi==0.1.12",
    "flashinfer-python==0.6.13",
]
