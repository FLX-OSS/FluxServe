[build-system]
requires = ["setuptools>=81.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxserve"
dynamic = ["version"]
description = "A high-performance inference serving library for diffusion language models"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "aiohttp==3.13.5",
    "apache-tvm-ffi==0.1.9",
    "fastapi==0.136.1",
    "flashinfer-python==0.6.13",
    "flux-kernel",
    "flux-scheduler",
    "huggingface-hub==1.16.1",
    "nanobind>=1.7.0",
    "ninja==1.13.0",
    "numpy==2.3.5",
    "nvidia-cutlass-dsl==4.5.1",
    "nvidia-ml-py==13.595.45",
    "packaging==26.2",
    "pyzmq==27.1.0",
    "safetensors==0.7.0",
    "scikit-build-core==0.12.2",
    "setproctitle==1.3.7",
    "tokenizers==0.22.2",
    "torch==2.11.0+cu130",
    "torchaudio==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "transformers==5.6.0",
    "triton==3.6.0",
    "uvicorn==0.47.0",
]

[project.scripts]
fluxserve = "fluxserve.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]
exclude = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "fluxserve.__version__" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
flashinfer-python = { git = "https://github.com/kennethzhao24/flashinfer-dllm.git", rev = "631231b2d8a6b7a1d59dfcc9be13b81df30a3416" }
flux-kernel = { path = "flux-kernel/python", editable = true }
flux-scheduler = { path = "flux-scheduler", editable = true }

[tool.uv.extra-build-dependencies]
flux-kernel = [
    "setuptools>=81.0.0",
    "torch==2.11.0+cu130",
    "apache-tvm-ffi==0.1.9",
    "flashinfer-python==0.6.13",
]
