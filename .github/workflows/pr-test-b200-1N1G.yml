name: B200 PR Tests (Apptainer)

# Add this concurrency block
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
on:
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "flux-kernel/**"
      - "flux-scheduler/**"
      - "test/**"
      - ".github/workflows/pr-test-b200.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-tests:
    name: B200 GPU / GSM8K Eval / Apptainer
    # This must be a self-hosted runner where Apptainer and the SIF image exist.
    runs-on: [self-hosted, linux, fluxserve-b200]
    timeout-minutes: 240

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install FluxServe
        run: |
          set -euo pipefail
          bash test/ci/env/b200.sh \
            bash -lc 'cd "$GITHUB_WORKSPACE" && \
                      export PIP_BREAK_SYSTEM_PACKAGES=1 && \
                      export FLUX_KERNEL_CUDA_ARCH=100 && \
                      python -m pip install -e flux-kernel/python --no-build-isolation && \
                      python -m pip install -e flux-scheduler && \
                      python -m pip install -e .'

      - name: Run LLaDA2.1 Decoder Unit Tests
        run: |
          set -euo pipefail
          bash test/ci/env/b200.sh \
            bash -lc 'cd "$GITHUB_WORKSPACE" && \
                      export PIP_BREAK_SYSTEM_PACKAGES=1 && \
                      python -m pip install -q pytest && \
                      python -m pytest -q \
                        test/runtime/test_joint_threshold_decoder.py \
                        test/runtime/test_block_finished_equivalence.py'

      - name: Run GSM8K Eval Test
        run: |
          set -euo pipefail
          bash test/ci/env/b200.sh \
            bash -lc 'cd "$GITHUB_WORKSPACE" && \
                      bash test/ci/eval/1N1G/gsm8k.sh'
