name: GH200 Checks (Apptainer)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-tests:
    name: GPU / HumanEval+GSM8K tests / Apptainer
    # This must be a self-hosted runner where Apptainer and the SIF image exist.
    runs-on: [self-hosted, linux, fluxserve-gh200]
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install and run tests in Apptainer
        run: |
          bash /u/yzhao25/FluxServe/test/benchmark/fluxserve/apptainer/run_humaneval.sh
          bash /u/yzhao25/FluxServe/test/benchmark/sglang/apptainer/run_humaneval.sh

