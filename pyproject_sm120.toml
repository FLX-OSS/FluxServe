# FluxServe install profile for SM120 (RTX PRO 6000 Blackwell), pinned to the flux-sm120 image
# (docker/Dockerfile.flux-sm120). pip only reads pyproject.toml:
#   ln -sf pyproject_sm120.toml pyproject.toml
#   BUILD_NVEP=0 FLASHINFER_BUILD_NO_PIP=1 pip install -e ".[sm120,dev]" \
#       --extra-index-url https://download.pytorch.org/whl/cu130
# Then install flux-kernel and flux-scheduler; see docs/guides/getting_started.md.
# Base dependencies stay empty so `pip install -e .` inside the containers is unchanged.

[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxserve"
# setup.py sets the version (python/fluxserve/__init__.py) and python_requires, which setuptools lets
# override requires-python. The container runs Python 3.12, and the numpy 2.5 / scipy 1.18 pins need >=3.12.
dynamic = ["version", "requires-python"]
description = "A High-Performance Inference Serving Library for Diffusion Language Model"
license = "MIT"
dependencies = []

[project.optional-dependencies]
sm120 = [
    # PyTorch cu130 builds (download.pytorch.org/whl/cu130).
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "torchaudio==2.11.0+cu130",
    "triton==3.6.0",
    "cuda-python==13.2.0",
    # Attention and kernel stack.
    "flashinfer-python @ git+https://github.com/FLX-OSS/flashinfer-dllm.git@a7d243e0b25697b021cc9366f1326d7b5013287b",
    "flash-attn-4[cu13] @ git+https://github.com/Dao-AILab/flash-attention.git@e9515d5dee6ade134a33d6020d38d01ef0596996#subdirectory=flash_attn/cute",
    "nvidia-cutlass-dsl[cu13]==4.8.0",
    "apache-tvm-ffi==0.1.14.post1",
    "quack-kernels==0.6.5",
    "torch-c-dlpack-ext==0.1.5",
    "cuda-tile==1.6.0",
    "nccl4py==0.6.0",
    "nvidia-cudnn-frontend==1.30.0",
    # Models and serving.
    "transformers==5.17.0",
    "tokenizers==0.23.2",
    "safetensors==0.8.0",
    "huggingface-hub==1.33.0",
    "numpy==2.5.2",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "aiohttp==3.14.3",
    "setproctitle==1.3.8",
    "tqdm==4.70.1",
    "packaging==26.3",
    # Transitive packages pinned because newer releases drifted from the image.
    "certifi==2026.7.22",
    "cuda-core==1.2.1",
    "cuda-pathfinder==1.8.3",
    "filelock==3.32.3",
    "fsspec==2026.7.0",
    "hf-xet==1.6.0",
    "markupsafe==3.0.3",
    "networkx==3.6.1",
    "opentelemetry-api==1.45.0",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "starlette==1.7.0",
    "typer==0.27.2",
]
# Tools the image installs explicitly (tests, CI pipeline, benchmarks, native builds).
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.10",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "ninja==1.13.2",
    "scikit-build-core==1.1.1",
    "nanobind==3.1.0",
    "wheel==0.48.0",
    # Transitive packages pinned because newer releases drifted from the image.
    "fonttools==4.66.1",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "python-dateutil==2.9.0.post0",
]

[project.scripts]
fluxserve = "fluxserve.cli.app:main"
