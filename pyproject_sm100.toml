# FluxServe install profile for SM100 (B200), pinned to the flux-cu130-gemma image (sglang
# v0.5.12.post1 cu130 base with flashinfer-dllm). pip only reads pyproject.toml:
#   ln -sf pyproject_sm100.toml pyproject.toml
#   pip install -e ".[sm100,dev]" --extra-index-url https://download.pytorch.org/whl/cu130
#   BUILD_NVEP=0 FLASHINFER_BUILD_NO_PIP=1 pip install --no-deps --group sm100-nodeps
# Then install flux-kernel and flux-scheduler; see docs/guides/getting_started.md.
# Base dependencies stay empty so `pip install -e .` inside the containers is unchanged.

[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxserve"
# setup.py sets the version (python/fluxserve/__init__.py) and python_requires, which setuptools lets
# override requires-python. The container runs Python 3.12.
dynamic = ["version", "requires-python"]
description = "A High-Performance Inference Serving Library for Diffusion Language Model"
license = "MIT"
dependencies = []

[project.optional-dependencies]
sm100 = [
    # PyTorch cu130 builds (download.pytorch.org/whl/cu130).
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "torchaudio==2.11.0+cu130",
    "torchao==0.17.0+cu130",
    "triton==3.6.0",
    "cuda-python==13.2.0",
    # Attention and kernel stack.
    "flash-attn-4[cu13]==4.0.0b14",
    "nvidia-cutlass-dsl[cu13]==4.5.1",
    "apache-tvm-ffi==0.1.9",
    "quack-kernels==0.4.1",
    "torch-c-dlpack-ext==0.1.5",
    # Requirements of flashinfer-python, which the sm100-nodeps group installs without its dependencies.
    "cuda-tile==1.3.0",
    "nvidia-cudnn-frontend==1.24.0",
    "nvidia-ml-py==13.595.45",
    "ninja==1.13.0",
    "click==8.4.1",
    "einops==0.8.2",
    "requests==2.34.2",
    "tabulate==0.10.0",
    # Models and serving.
    "transformers==5.6.0",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "huggingface-hub==1.16.1",
    "numpy==2.3.5",
    "pyyaml==6.0.1",
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
    "aiohttp==3.13.5",
    "setproctitle==1.3.7",
    "tqdm==4.67.3",
    "packaging==26.2",
    # Transitive packages pinned because newer releases drifted from the image.
    "aiohappyeyeballs==2.6.2",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "cuda-pathfinder==1.5.4",
    "filelock==3.29.0",
    "fsspec==2026.2.0",
    "hf-xet==1.5.0",
    "idna==3.16",
    "markupsafe==3.0.3",
    "multidict==6.7.1",
    "networkx==3.6.1",
    "pillow==12.2.0",
    "propcache==0.5.2",
    "pydantic==2.13.4",
    "pygments==2.20.0",
    "regex==2026.5.9",
    "starlette==1.0.1",
    "typer==0.25.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.7.0",
    "yarl==1.24.2",
]
# Tools the image ships (tests, benchmarks, native builds).
dev = [
    "pytest==9.0.3",
    "scipy==1.17.1",
    "pandas==3.0.3",
    "matplotlib==3.10.9",
    "scikit-build-core==0.12.2",
    "wheel==0.47.0",
    # Transitive packages pinned because newer releases drifted from the image.
    "contourpy==1.3.3",
    "fonttools==4.63.0",
    "iniconfig==2.3.0",
    "kiwisolver==1.5.0",
    "pluggy==1.6.0",
    "pyparsing==3.1.1",
    "python-dateutil==2.9.0.post0",
]

[project.scripts]
fluxserve = "fluxserve.cli.app:main"

[dependency-groups]
# Install with `pip install --no-deps --group sm100-nodeps`, as the image does. flashinfer-dllm declares
# newer cutlass-dsl, cuda-tile and cudnn-frontend than this stack runs, and the image's NCCL and nvJitLink
# conflict with torch's pins. The nvcc, crt, tileiras and nvvm wheels came from FlashInfer's cuda-tile
# build hook in the image.
sm100-nodeps = [
    "flashinfer-python @ git+https://github.com/FLX-OSS/flashinfer-dllm.git@a7d243e0b25697b021cc9366f1326d7b5013287b",
    "nvidia-nccl-cu13==2.31.2",
    "nvidia-nvjitlink==13.3.33",
    "nvidia-cuda-nvcc==13.3.73",
    "nvidia-cuda-crt==13.3.73",
    "nvidia-cuda-tileiras==13.3.36",
    "nvidia-nvvm==13.3.73",
]
