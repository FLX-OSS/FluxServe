# FluxServe install profile for SM90 (H100/H200), pinned to the flux-cu130-fa4 image
# (docker/Dockerfile.flux-cu130-fa4). pip only reads pyproject.toml:
#   ln -sf pyproject_sm90.toml pyproject.toml
#   BUILD_NVEP=0 FLASHINFER_BUILD_NO_PIP=1 pip install -e ".[sm90,dev]" \
#       --extra-index-url https://download.pytorch.org/whl/cu130
# Then install flux-kernel and flux-scheduler; see docs/guides/getting_started.md.
# Base dependencies stay empty so `pip install -e .` inside the containers is unchanged.

[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxserve"
# setup.py sets the version (python/fluxserve/__init__.py) and python_requires, which setuptools lets
# override requires-python. The container runs Python 3.12, and the numpy 2.5 / scipy 1.18 pins need >=3.12.
dynamic = ["version", "requires-python"]
description = "A High-Performance Inference Serving Library for Diffusion Language Model"
license = "MIT"
dependencies = []

[project.optional-dependencies]
sm90 = [
    # PyTorch cu130 builds (download.pytorch.org/whl/cu130).
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "torchaudio==2.11.0+cu130",
    "triton==3.6.0",
    "cuda-python==13.2.0",
    # Attention and kernel stack. The FA4 commit is the fa4-v4.0.0.beta29 release tag.
    "flashinfer-python @ git+https://github.com/FLX-OSS/flashinfer-dllm.git@a7d243e0b25697b021cc9366f1326d7b5013287b",
    "flash-attn-4[cu13] @ git+https://github.com/Dao-AILab/flash-attention.git@ce088ab9ce0fc0434dcd8afa0a791da9fcc3a820#subdirectory=flash_attn/cute",
    "nvidia-cutlass-dsl[cu13]==4.6.2",
    "apache-tvm-ffi==0.1.13.post3",
    "quack-kernels==0.6.4",
    "torch-c-dlpack-ext==0.1.5",
    "cuda-tile==1.5.0",
    "nccl4py==0.5.0",
    "nvidia-cudnn-frontend==1.28.0",
    # Models and serving.
    "transformers==5.6.0",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "huggingface-hub==1.30.0",
    "numpy==2.5.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "aiohttp==3.14.3",
    "setproctitle==1.3.7",
    "tqdm==4.70.0",
    "packaging==26.3",
    # Transitive packages pinned because newer releases drifted from the image.
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "cuda-core==1.2.0",
    "cuda-pathfinder==1.8.1",
    "filelock==3.32.3",
    "fsspec==2026.7.0",
    "hf-xet==1.6.0",
    "idna==3.19",
    "markupsafe==3.0.3",
    "multidict==6.7.1",
    "networkx==3.6.1",
    "nvidia-cuda-nvdisasm==13.3.73",
    "nvidia-ml-py==13.610.43",
    "pillow==12.3.0",
    "propcache==0.5.2",
    "pydantic==2.13.5",
    "regex==2026.9.3",
    "starlette==1.6.0",
    "typer==0.27.2",
    "urllib3==2.7.0",
    "yarl==1.24.5",
]
# Tools the image installs explicitly (tests, CI pipeline, benchmarks, native builds).
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.6",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scipy==1.18.1",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "ninja==1.13.2",
    "scikit-build-core==1.0.3",
    "nanobind==3.0.1",
    "wheel==0.48.0",
    # Transitive packages pinned because newer releases drifted from the image.
    "contourpy==1.3.3",
    "fonttools==4.64.0",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
]

[project.scripts]
fluxserve = "fluxserve.cli.app:main"
